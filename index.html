<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Day of Year</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#3694E9" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

    <h1>📅 Day of Year</h1>

  <script>
