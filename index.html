<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Day of Year</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#3694E9" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">

    <nav class="nav">
      <button class="tab active" data-view="main">Heute</button>
      <button class="tab" data-view="stats">Statistik</button>
    </nav>

    <!-- Hauptansicht -->
    <section id="mainView">
      <div class="heading">
        <img class="doy-icon" src="./icons/doy-icon-72.png" alt="DoY icon">
        <h1>Day of Year</h1>
      </div>

      <button type="button" id="confirmBtn"></button>

      <p id="date"></p>
      <p id="status"></p>
    </section>

    <!-- Statistikansicht -->
    <section id="statsView" hidden>
      <div class="year-selector">
        <select id="yearSelect"></select>
      </div> 
      
      <div class="year-summary">
        <span>Gesamt</span>
        <strong id="yearTotal">0</strong>
      </div>

      <div id="yearGrid"></div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
